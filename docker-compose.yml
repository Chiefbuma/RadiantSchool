services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rhit-web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL:-http://localhost:3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://rhit:rhit_password@postgres:5432/rhit}
      NODE_ENV: production
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3001}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-15}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      SCHOOL_META_APP_ID: ${SCHOOL_META_APP_ID:-2221357331931817}
      SCHOOL_META_WHATSAPP_BUSINESS_ACCOUNT_ID: ${SCHOOL_META_WHATSAPP_BUSINESS_ACCOUNT_ID:-980908518150007}
      SCHOOL_META_WHATSAPP_PHONE_NUMBER_ID: ${SCHOOL_META_WHATSAPP_PHONE_NUMBER_ID:-1276369935549330}
      SCHOOL_META_WHATSAPP_VERIFY_TOKEN: ${SCHOOL_META_WHATSAPP_VERIFY_TOKEN:-}
      SCHOOL_META_APP_SECRET: ${SCHOOL_META_APP_SECRET:-}
      SCHOOL_META_WHATSAPP_ACCESS_TOKEN: ${SCHOOL_META_WHATSAPP_ACCESS_TOKEN:-}
      SCHOOL_META_TEMPLATE_LANGUAGE: ${SCHOOL_META_TEMPLATE_LANGUAGE:-en}
      SCHOOL_WHATSAPP_STATUS_TEMPLATE: ${SCHOOL_WHATSAPP_STATUS_TEMPLATE:-rhti_application_status_v1}
      SCHOOL_WHATSAPP_OFFER_TEMPLATE: ${SCHOOL_WHATSAPP_OFFER_TEMPLATE:-rhti_offer_letter_v1}
      WHATSAPP_DISPATCH_SECRET: ${WHATSAPP_DISPATCH_SECRET:-}
    ports:
      - "${WEB_PORT:-3001}:3000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: rhit-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rhit}
      POSTGRES_USER: ${POSTGRES_USER:-rhit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rhit_password}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
